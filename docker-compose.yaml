version: '3.8'

services:
  app:
    build: .
    command: uvicorn AWS.app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./AWS/app:/code
      - .:/app:ro
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DSN=postgresql+psycopg2://postgres:password@db:5432/finstat
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finstat
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db-data: